services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: signnow/python-sample-app
    container_name: signnow-python-sample-app
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/samples', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
